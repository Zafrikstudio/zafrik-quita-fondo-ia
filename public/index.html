<!-- =====================================================
     ZAFRIK IA PRO V6.7
     HOSTINGER - ALTURA AUTOMÁTICA
====================================================== -->

<section id="zafrik-ia-pro">

<style>
#zafrik-ia-pro{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:0;

  background:#f6f8fc;

  border-radius:22px;

  /* IMPORTANTE:
     no cortar el contenido */
  overflow:visible;

  box-sizing:border-box;

  box-shadow:
    0 20px 60px rgba(0,0,0,.10);
}

#zafrik-ia-pro iframe{
  display:block;

  width:100%;

  /* Altura inicial mientras carga Render */
  height:2600px;

  min-height:1200px;

  margin:0;
  padding:0;

  border:0;
  outline:0;

  background:#f6f8fc;

  transition:height .25s ease;
}

/* TABLET */
@media(max-width:900px){

  #zafrik-ia-pro{
    border-radius:18px;
  }

  #zafrik-ia-pro iframe{
    min-height:1800px;
  }

}

/* CELULAR */
@media(max-width:600px){

  #zafrik-ia-pro{
    width:100%;
    border-radius:12px;
  }

  #zafrik-ia-pro iframe{
    min-height:2400px;
  }

}
</style>


<iframe
  id="zafrik-ia-frame"

  src="https://zafrik-quita-fondo-ia.onrender.com"

  title="ZAFRIK IA PRO"

  loading="eager"

  scrolling="no"

  allow="clipboard-read; clipboard-write"
></iframe>


<script>
(function(){

  const iframe =
    document.getElementById("zafrik-ia-frame");

  if(!iframe) return;


  /* =========================================
     RECIBIR ALTURA DESDE ZAFRIK IA PRO
  ========================================= */

  window.addEventListener(
    "message",
    function(event){

      /* SEGURIDAD:
         aceptar únicamente mensajes
         provenientes de nuestro Render */
      if(
        event.origin !==
        "https://zafrik-quita-fondo-ia.onrender.com"
      ){
        return;
      }


      const data = event.data;

      if(
        !data ||
        data.type !== "ZAFRIK_HEIGHT"
      ){
        return;
      }


      let height =
        Number(data.height);


      if(
        !Number.isFinite(height) ||
        height < 500
      ){
        return;
      }


      /* margen inferior adicional */
      height =
        Math.ceil(height) + 30;


      iframe.style.height =
        height + "px";

    }
  );


  /* =========================================
     ALTURA DE SEGURIDAD AL CARGAR
  ========================================= */

  iframe.addEventListener(
    "load",
    function(){

      /* Render puede tardar unos segundos
         en despertar en el plan gratuito */

      setTimeout(function(){

        try{

          iframe.contentWindow.postMessage(
            {
              type:
              "ZAFRIK_REQUEST_HEIGHT"
            },
            "https://zafrik-quita-fondo-ia.onrender.com"
          );

        }catch(e){}

      },1000);


      setTimeout(function(){

        try{

          iframe.contentWindow.postMessage(
            {
              type:
              "ZAFRIK_REQUEST_HEIGHT"
            },
            "https://zafrik-quita-fondo-ia.onrender.com"
          );

        }catch(e){}

      },3000);

    }
  );

})();
</script>

</section>
